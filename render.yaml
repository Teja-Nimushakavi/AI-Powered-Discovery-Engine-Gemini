services:
  - type: web
    name: discovery-engine-api
    env: python
    buildCommand: "pip install -r requirements_api.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GOOGLE_API_KEY
        sync: false
