version: "3.9"

# =============================================================================
# AI-Powered RAG Discovery Engine — Full Stack Docker Compose
# =============================================================================
# Services: PostgreSQL, ChromaDB, Redis, API (FastAPI), Frontend (React)
# Usage: docker compose up -d
# =============================================================================

services:
  # ── PostgreSQL — Structured data storage ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: myntra-rag-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myntra_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myntra_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # ── ChromaDB — Vector database for embeddings ───────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: myntra-rag-chromadb
    restart: unless-stopped
    ports:
      - "${CHROMADB_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rag-network

  # ── Redis — Caching and message queue ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: myntra-rag-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - rag-network

  # ── API — FastAPI RAG Backend ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: myntra-rag-api
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-myntra_rag}
      - CHROMA_HOST=chromadb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-network

  # ── Frontend — React Dashboard ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myntra-rag-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - rag-network

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local

networks:
  rag-network:
    driver: bridge
